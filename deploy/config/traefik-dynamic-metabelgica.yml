# traefik dynamic configuration

http:
  services:
    wikibase:
      loadBalancer:
        servers:
          - url: "http://wikibase:80"

    wdqs:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8840"

    wdqs-frontend:
      loadBalancer:
        servers:
          - url: "http://wdqs-frontend:80"

    quickstatements:
      loadBalancer:
        servers:
          - url: "http://quickstatements:80"

  routers:
    wikibase-router:
      entryPoints: [ webx ]
      rule: 'Host(`{{ env "WIKIBASE_PUBLIC_HOST" }}`) && !PathPrefix(`/tools`)'
      service: wikibase

    wdqs-router:
      entryPoints: [ webkx ]
      rule: 'Host(`{{ env "WDQS_PUBLIC_HOST" }}`) && PathPrefix(`/sparql`) && (Method(`GET`) || Method(`OPTIONS`) || Method(`POST`))'
      service: wdqs
      middlewares: 
        - wdqs-prefix
        - wdqs-headers
        - wdqs-cors-headers
        - wdqs-rate-limit
        - wdqs-auth
        - strip-auth-header

    wdqs-frontend-router:
      entryPoints: [ webkx ]
      rule: 'Host(`{{ env "WDQS_PUBLIC_HOST" }}`) && !PathPrefix(`/sparql`)'
      service: wdqs-frontend

    quickstatements-router:
      entryPoints: [ webx ]
      rule: 'Host(`{{ env "WIKIBASE_PUBLIC_HOST" }}`) && PathPrefix(`/tools/quickstatements`)'
      service: quickstatements
      middlewares: [ quickstatements-redirectregex, quickstatements-stripprefix ]

  middlewares:
    wdqs-auth: 
      forwardAuth:
        address: "http://host.docker.internal:8000/verify"
#        basicAuth:
#          users:
#            - "admin:$apr1$Z2YDmahm$Cvyln4SlH5ireAXwJjEHw/"
#            - "admin:$apr1$/zTcZbiH$SuGO9LnJTRTRnQ.nDlkDu."

    strip-auth-header:
      headers:
        customRequestHeaders:
          Authorization: "" 

    wdqs-prefix:
      redirectRegex:
        regex: "^/sparql/?(.*)"
        replacement: "/"
        permanent: true

    wdqs-headers:
      headers:
        accessControlAllowMethods: "GET,OPTIONS,POST"
        customResponseHeaders:
          VARY: Accept
        customRequestHeaders:
          X-BIGDATA-READ-ONLY: yes
          X-BIGDATA-MAX-QUERY-MILLIS: "300000"

    wdqs-cors-headers:
      headers:
        accessControlAllowHeaders: "*"

    wdqs-rate-limit:
      rateLimit:
        burst: 30
        average: 60
        period: 1m

    quickstatements-redirectregex:
      redirectRegex:
        regex: /tools/quickstatements$
        replacement: /tools/quickstatements/
        permanent: true

    quickstatements-stripprefix:
      stripPrefix:
        prefixes: [ /tools/quickstatements ]
